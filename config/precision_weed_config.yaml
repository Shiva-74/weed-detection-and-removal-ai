---
dataset:
  path: "data/processed/combined_weeds"
  train: "train/images"
  val: "val/images"
  test: "test/images"
  nc: 2  # 0: crop, 1: weed
  names: ['crop', 'weed']
  
  # High resolution for precision
  img_width: 1024
  img_height: 1024

model:
  architecture: "yolov8m"  # Medium model for better precision
  pretrained: true

training:
  epochs: 150
  batch_size: 16  # Reduced for higher resolution
  image_size: 1024  # Higher resolution for precise detection
  learning_rate: 0.001
  weight_decay: 0.0005
  momentum: 0.937
  device: "0"
  workers: 8
  patience: 30
  save_period: 10

# Precision-focused augmentation
augmentation:
  hsv_h: 0.01  # Reduced color variations for precision
  hsv_s: 0.3
  hsv_v: 0.3
  degrees: 5.0  # Reduced rotation
  translate: 0.05  # Reduced translation
  scale: 0.3  # Reduced scaling
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.8  # Reduced mosaic
  mixup: 0.0

optimization:
  optimizer: "AdamW"
  close_mosaic: 15
  amp: true

# Precision-focused detection parameters
detection:
  conf_threshold: 0.15  # Lower for better recall
  iou_threshold: 0.3   # Lower for precise boxes
  max_det: 100  # More detections per image
  multi_label: true
  agnostic_nms: false

# Enhanced export settings
export:
  formats: ['onnx', 'engine', 'tflite']
  dynamic: false
  half: true
  int8: false
  workspace: 8
  simplify: true

deployment:
  confidence: 0.25
  iou_threshold: 0.3
  max_detections: 100
  agnostic_nms: false

# Only weeds trigger laser action
weed_classes: [1]  # Class 1 = weed
crop_classes: [0]  # Class 0 = crop

